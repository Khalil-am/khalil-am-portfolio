name: Export IQ logo candidates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright library
        run: npm install --no-save --ignore-scripts playwright@1.54.1

      - name: Collect IQ logo candidates
        continue-on-error: true
        run: |
          mkdir -p iq-logo-candidates
          echo "Logo collection started" > iq-logo-candidates/run.txt
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using browser: ${CHROME_PATH}"
          test -n "${CHROME_PATH}"
          sed -i 's|const browser = await chromium.launch({ headless: true });|const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_PATH, args: ["--no-sandbox"] });|' scripts/export-iq-logo-candidates.mjs
          CHROME_PATH="${CHROME_PATH}" node scripts/export-iq-logo-candidates.mjs

      - name: Upload collected assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iq-logo-candidates
          path: iq-logo-candidates
          if-no-files-found: error
          retention-days: 1
